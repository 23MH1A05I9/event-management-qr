spring.application.name=event-management-qr
# App

server.port=${PORT:8080}

# MySQL Database (PERMANENT STORAGE)
# All values below fall back to local dev defaults if the env var isn't set.
# In production (Railway), these are provided as environment variables — never hardcoded here.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventdbqr?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA - update keeps data, never drops tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Thymeleaf
spring.thymeleaf.cache=false

# Email (Gmail SMTP) - credentials come from environment variables, never hardcoded
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true